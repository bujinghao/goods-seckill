<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="current-user-id" th:content="${userId}">
    <title>秒杀结果</title>
    <meta name="description" content="查看秒杀结果">
    <link rel="stylesheet" href="/css/seckill.css" th:href="@{/css/seckill.css}">
    <style>
        .result-page .result-card { background: #fff; border-radius: 16px; padding: 48px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .result-page .result-icon { font-size: 64px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="container">
            <h1><a href="/">⚡ 秒杀商城</a></h1>
            <div class="user-info">
                <a href="/" class="logout-btn">← 返回首页</a>
            </div>
        </div>
    </header>

    <!-- 结果页 -->
    <main class="result-page container">
        <div class="result-card">
            <!-- 有订单号：成功 -->
            <div th:if="${orderNo != null and !#strings.isEmpty(orderNo)}">
                <div class="result-icon">🎉</div>
                <h2 class="result-title success">恭喜！秒杀成功！</h2>
                <p class="result-detail">
                    订单编号：<span class="order-no" th:text="${orderNo}">202401010000000001</span>
                </p>
                <p class="result-detail" style="color: #ff4757; font-size: 13px;">
                    请尽快完成支付，超时订单将自动取消
                </p>
                <div class="result-actions">
                    <a href="/" class="btn btn-primary">继续抢购</a>
                    <a href="/order/result?goodsId=" th:href="'/order/result?goodsId=' + ${goodsId}" class="btn btn-secondary">查看订单</a>
                </div>
            </div>

            <!-- 无订单号：处理中或失败 -->
            <div th:unless="${orderNo != null and !#strings.isEmpty(orderNo)}">
                <div class="result-icon" id="resultIcon">⏳</div>

                <!-- 正在处理中 -->
                <div id="processingStatus">
                    <h2 class="result-title" style="color: #f57c00;">订单处理中</h2>
                    <p class="result-detail">您的秒杀请求正在排队处理，请稍候...</p>
                    <div style="margin: 20px auto; width: 48px; height: 48px; border: 4px solid #f0f0f0; border-top: 4px solid #ff4757; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                    <p class="result-detail" style="font-size: 12px; color: #999;">页面将在订单处理完成后自动刷新</p>
                </div>

                <!-- 查询结果区域 -->
                <div id="orderResultArea" class="order-result-area" style="display: none;">
                    <h3 style="font-size: 14px; margin-bottom: 12px; color: #333;">订单查询结果</h3>
                    <div id="orderList"></div>
                </div>

                <div class="result-actions" style="margin-top: 24px;">
                    <a href="/" class="btn btn-primary">返回首页</a>
                    <a href="javascript:void(0)" class="btn btn-secondary" onclick="location.reload()">刷新页面</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/seckill.js" th:src="@{/js/seckill.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 如果没有订单号，启动轮询或查询订单状态
            var orderNo = '[[${orderNo}]]';
            var goodsId = '[[${goodsId}]]';
            var userId = '[[${userId}]]';

            if ((!orderNo || orderNo === '') && userId && userId !== '') {
                // 尝试查询订单
                checkOrderStatus(userId, goodsId);
            }

            /**
             * 查询订单状态
             */
            function checkOrderStatus(uid, gid) {
                var maxRetries = 60;
                var retryCount = 0;

                function poll() {
                    retryCount++;
                    if (retryCount > maxRetries) {
                        document.getElementById('processingStatus').innerHTML = `
                            <h2 class="result-title fail" style="color: #999;">查询超时</h2>
                            <p class="result-detail">订单处理时间较长，请前往订单中心查看</p>
                        `;
                        return;
                    }

                    var url = '/seckill/order/check?userId=' + uid + '&goodsId=' + gid;
                    fetch(url)
                        .then(function(resp) { return resp.json(); })
                        .then(function(data) {
                            if (data.code === 200 && data.data) {
                                // 订单已生成，跳转到成功页面
                                window.location.href = '/order/result?orderNo=' + data.data.orderNo + '&goodsId=' + gid;
                            } else {
                                // 继续轮询
                                setTimeout(poll, 3000);
                            }
                        })
                        .catch(function() {
                            setTimeout(poll, 5000);
                        });
                }

                setTimeout(poll, 3000);
            }
        });
    </script>
</body>
</html>
