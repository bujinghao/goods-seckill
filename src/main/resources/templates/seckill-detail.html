<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'秒杀 - ' + ${goods.goodsName}">秒杀商品详情</title>
    <meta name="description" th:content="'限时秒杀：' + ${goods.goodsName} + '，秒杀价仅¥' + ${#numbers.formatDecimal(goods.seckillPrice, 1, 2)}">
    <link rel="stylesheet" href="/css/seckill.css" th:href="@{/css/seckill.css}">
    <style>
        .detail-page .detail-seckill-price { font-size: 36px; font-weight: 700; color: #ff4757; }
        .detail-page .countdown .time-block .num { display: inline-block; min-width: 36px; padding: 4px 8px; background: #333; color: #fff; border-radius: 4px; font-size: 20px; font-weight: 700; }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header" th:replace="~{fragments/header :: header}"></header>

    <!-- 商品详情 -->
    <main class="detail-page container">
        <div class="goods-detail">
            <div class="detail-header">
                <!-- 商品图片 -->
                <div class="detail-img-wrapper">
                    <img th:if="${goods.goodsImg != null and !goods.goodsImg.isEmpty()}"
                         class="detail-img"
                         th:src="${goods.goodsImg}"
                         alt="" th:alt="${goods.goodsName}" />
                    <div th:unless="${goods.goodsImg != null and !goods.goodsImg.isEmpty()}"
                         class="detail-img-placeholder">
                        <span th:text="${#strings.substring(goods.goodsName, 0, 1)}">商</span>
                    </div>
                </div>

                <!-- 商品信息 -->
                <div class="detail-info">
                    <h2 class="detail-name" th:text="${goods.goodsName}">商品名称</h2>
                    <p class="detail-title" th:text="${goods.goodsTitle}">商品描述</p>

                    <!-- 价格展示 -->
                    <div class="detail-price-row">
                        <div>
                            <span class="detail-seckill-price">
                                <span class="currency">¥</span><span th:text="${#numbers.formatDecimal(goods.seckillPrice, 1, 2)}">0.00</span>
                            </span>
                        </div>
                        <div>
                            <span class="detail-original-price">¥<span th:text="${#numbers.formatDecimal(goods.goodsPrice, 1, 2)}">0.00</span></span>
                        </div>
                    </div>

                    <!-- 库存信息 -->
                    <div class="detail-stock">
                        剩余 <span class="stock-num" th:text="${goods.stockCount}">0</span> 件
                        <span th:if="${goods.stockCountPerUser > 0}">
                            ｜每人限购 <span class="stock-num" th:text="${goods.stockCountPerUser}">1</span> 件
                        </span>
                    </div>

                    <!-- 倒计时 -->
                    <div class="detail-time">
                        <div class="countdown" id="countdown">
                            <span class="label">加载中...</span>
                        </div>
                    </div>

                    <!-- 秒杀按钮 -->
                    <button class="seckill-btn" id="seckillBtn"
                            th:data-goods-id="${goods.id}"
                            th:disabled="${goods.status == 2}"
                            th:classappend="${goods.status == 0 ? 'not-started' : (goods.status == 2 ? 'ended' : '')}"
                            onclick="startSeckillFlow(parseInt(this.dataset.goodsId))">
                        <span th:text="${goods.status == 0 ? '即将开始' : (goods.status == 2 ? '已结束' : '立即秒杀')}">立即秒杀</span>
                    </button>

                    <!-- 轮询状态指示器 -->
                    <div class="polling-indicator" id="pollingIndicator">
                        <span class="dot"></span>
                        <span>正在查询订单结果...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品描述 -->
        <div th:if="${goods.goodsDesc != null and !goods.goodsDesc.isEmpty()}"
             style="background: #fff; border-radius: 12px; padding: 24px; margin-top: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">
            <h3 style="font-size: 16px; margin-bottom: 12px; color: #333;">商品详情</h3>
            <p style="font-size: 14px; color: #666; line-height: 1.8;" th:text="${goods.goodsDesc}">商品描述</p>
        </div>
    </main>

    <!-- 排队提示弹窗 -->
    <div class="queue-modal" id="queueModal">
        <div class="modal-content">
            <h3>正在排队中...</h3>
            <div class="spinner"></div>
            <p class="queue-info">系统正在处理您的请求，请稍候</p>
            <p class="queue-info" style="font-size: 12px; color: #999;">请不要刷新页面或重复点击</p>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="login-modal" id="loginModal">
        <div class="login-modal-content">
            <div class="login-modal-header">
                <h3>用户登录</h3>
                <span class="login-close" onclick="SeckillLogin.hide()">&times;</span>
            </div>
            <div class="login-modal-body">
                <div class="login-form-group">
                    <label for="loginUsername">账号</label>
                    <input type="text" id="loginUsername" class="login-input" placeholder="请输入用户名" autocomplete="username" />
                </div>
                <div class="login-form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" class="login-input" placeholder="请输入密码" autocomplete="current-password" />
                </div>
                <div class="login-error" id="loginError"></div>
            </div>
            <div class="login-modal-footer">
                <button class="login-btn-cancel" onclick="SeckillLogin.hide()">取消</button>
                <button class="login-btn-submit" id="loginSubmitBtn" onclick="SeckillLogin.submit()">登录</button>
            </div>
            <div class="login-modal-switch">
                <span>还没有账号？</span>
                <a href="javascript:void(0)" onclick="SeckillLogin.showRegister()">立即注册</a>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="login-modal" id="registerModal">
        <div class="login-modal-content">
            <div class="login-modal-header">
                <h3>用户注册</h3>
                <span class="login-close" onclick="SeckillRegister.hide()">&times;</span>
            </div>
            <div class="login-modal-body">
                <div class="login-form-group">
                    <label for="regUsername">账号</label>
                    <input type="text" id="regUsername" class="login-input" placeholder="请输入用户名（3-20个字符）" autocomplete="username" />
                </div>
                <div class="login-form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" class="login-input" placeholder="请输入密码（6-20个字符）" autocomplete="new-password" />
                </div>
                <div class="login-form-group">
                    <label for="regConfirmPassword">确认密码</label>
                    <input type="password" id="regConfirmPassword" class="login-input" placeholder="请再次输入密码" autocomplete="new-password" />
                </div>
                <div class="login-form-group">
                    <label for="regPhone">手机号 <span style="color:#999;font-weight:normal;">（选填）</span></label>
                    <input type="tel" id="regPhone" class="login-input" placeholder="请输入手机号" autocomplete="tel" />
                </div>
                <div class="login-form-group">
                    <label for="regEmail">邮箱 <span style="color:#999;font-weight:normal;">（选填）</span></label>
                    <input type="email" id="regEmail" class="login-input" placeholder="请输入邮箱" autocomplete="email" />
                </div>
                <div class="login-error" id="registerError"></div>
            </div>
            <div class="login-modal-footer">
                <button class="login-btn-cancel" onclick="SeckillRegister.hide()">取消</button>
                <button class="login-btn-submit" id="registerSubmitBtn" onclick="SeckillRegister.submit()">注册</button>
            </div>
            <div class="login-modal-switch">
                <span>已有账号？</span>
                <a href="javascript:void(0)" onclick="SeckillRegister.showLogin()">去登录</a>
            </div>
        </div>
    </div>

    <!-- 验证码弹窗 -->
    <div class="captcha-modal" id="captchaModal">
        <div class="captcha-modal-content">
            <div class="captcha-modal-header">
                <h3>安全验证</h3>
                <span class="captcha-close" onclick="SeckillCaptcha.hide()">&times;</span>
            </div>
            <div class="captcha-modal-body">
                <p class="captcha-tip">请输入验证码以继续秒杀</p>
                <div class="captcha-image-wrapper">
                    <img id="captchaImage" class="captcha-image" src="" alt="验证码" />
                    <span class="captcha-refresh" onclick="SeckillCaptcha.refresh()">换一张</span>
                </div>
                <div class="captcha-form-group">
                    <input type="text" id="captchaInput" class="captcha-input" placeholder="请输入验证码" maxlength="4" autocomplete="off" />
                </div>
                <div class="captcha-error" id="captchaError"></div>
            </div>
            <div class="captcha-modal-footer">
                <button class="captcha-btn-cancel" onclick="SeckillCaptcha.hide()">取消</button>
                <button class="captcha-btn-submit" id="captchaSubmitBtn" onclick="SeckillCaptcha.submit()">确认</button>
            </div>
        </div>
    </div>

    <script src="/js/seckill.js" th:src="@{/js/seckill.js}"></script>
    <script>
        /**
         * 秒杀流程入口：登录检查 → 验证码 → 动态URL → 执行秒杀
         */
        function startSeckillFlow(goodsId) {
            SeckillCaptcha.startFlow(goodsId);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 启动倒计时
            SeckillCountdown.start(
                'countdown',
                '[[${#temporals.format(goods.startTime, "yyyy-MM-dd HH:mm:ss")}]]',
                '[[${#temporals.format(goods.endTime, "yyyy-MM-dd HH:mm:ss")}]]'
            );

            // 格式化详情页时间显示
            var startStr = '[[${#temporals.format(goods.startTime, "yyyy-MM-dd HH:mm:ss")}]]';
            var endStr = '[[${#temporals.format(goods.endTime, "yyyy-MM-dd HH:mm:ss")}]]';
            if (startStr && endStr) {
                var timeInfo = document.querySelector('.detail-time');
                if (timeInfo) {
                    var infoEl = document.createElement('div');
                    infoEl.style.cssText = 'font-size: 13px; color: #999; margin-top: 8px;';
                    infoEl.textContent = '活动时间：' + startStr + ' 至 ' + endStr;
                    timeInfo.appendChild(infoEl);
                }
            }
        });
    </script>
</body>
</html>
